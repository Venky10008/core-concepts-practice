<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 3 - Form Validation</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="site-header"><h1>Exercise 3: Form Validation</h1></header>
  <main class="container">
    <div class="card">
      <h2>Sign up form</h2>
      <!-- novalidate: I turned off the browser's built-in bubbles so my own messages show instead -->
      <form id="signup-form" novalidate>
        <div>
          <label for="name">Name</label><br />
          <input type="text" id="name" name="name" />
          <div class="error-text" id="name-error"></div>
        </div>
        <div>
          <label for="email">Email</label><br />
          <input type="text" id="email" name="email" />
          <div class="error-text" id="email-error"></div>
        </div>
        <div>
          <label for="password">Password (min 8 characters)</label><br />
          <input type="password" id="password" name="password" />
          <div class="error-text" id="password-error"></div>
        </div>
        <br />
        <button type="submit">Sign up</button>
      </form>
      <p id="success-msg"></p>
    </div>
    <p><a href="../index.html">Back to home</a></p>
  </main>
  <script src="../js/ex3.js"></script>
</body>
</html>
